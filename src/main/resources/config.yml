# ===== SellPlugin =====
# Dinheiro: usa o Vault (se o seu plugin de economia estiver ligado ao Vault).
# Se NÃO tiver Vault, usa o comando abaixo, executado pelo console.
# Placeholders: {player} e {amount}
fallback-command: "eco give {player} {amount}"

# Vende automaticamente ao fechar o menu com ESC
sell-on-close: true

# Som ao vender (nome do som do Minecraft; veja a lista na wiki)
# Exemplos: entity.experience_orb.pickup | entity.player.levelup | block.note_block.pling | entity.arrow.hit_player
sound:
  enabled: true
  name: "entity.experience_orb.pickup"
  volume: 1.0
  pitch: 1.2

# Valor do item ao passar o mouse (tooltip). Cores com &
# Placeholders: {price} = valor de 1 item, {amount} = quantidade, {total} = valor da pilha
tooltip:
  line-price: "&7Vale: &a{price} &7cada"
  line-stack: "&7Pilha (&f{amount}&7): &a{total}"
  line-unsellable: "&cNão pode ser vendido"
  show-stack-line: true
  show-unsellable: true
  # Mostrar também no criativo? (PERIGO: no criativo o item pode ficar com a linha de valor de verdade)
  allow-creative: false

# Bônus por encantamento: cada encantamento soma % pelo nível dele.
# Ex.: Afiação V (+95%) + Inquebrável III (+60%) = +155% no preço.
# Nível maior que o último definido usa o último valor.
enchant-bonus:
  enabled: true
  cap-percent: 400   # limite do bônus total (400 = no máximo 5x o preço base)
  percent-by-level:
    1: 20
    2: 40
    3: 60
    4: 80
    5: 95

# Shulker box vende: preço da caixa (em price-patterns) + o valor de tudo que está dentro dela.
# Itens dentro que não vendem (bloqueados) são perdidos junto com a caixa.
shulker-includes-contents: true
# Preço da caixa em si (usado se não houver preço de shulker em prices/price-patterns)
shulker-box-price: 1000

# Preço dos itens que NÃO estão na lista "prices" (0 = não vende).
default-price: 1

# Preços especiais (dependem de encantamento)
special:
  bow: 100
  bow-flame: 12000
  crossbow: 100
  crossbow-quick-charge: 10000
  machado-vendedor: 50000   # preço do MachadoVendedor (SellAxe), mais caro que o machado normal

# Preço por LIVRO encantado (encantamento + nível). Livros sem preço aqui usam "ENCHANTED_BOOK" + bônus.
# Formato:  nome_do_encantamento: { nível: preço }
# Dá para editar no jogo: segure o livro e use /sell setprice hand <preço>
#   ou /sell setprice book <encantamento> <nível> <preço>
book-prices: {}
#  swift_sneak: { 3: 8000 }
#  mending: { 1: 5000 }

# Itens que nunca vendem. "*_CARPET" = qualquer item terminando em _CARPET
